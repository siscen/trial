<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Location Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
*{box-sizing:border-box}body{margin:0;font:13px Segoe UI,Arial,sans-serif;background:#f4f6f8;color:#142033}
button,input,select{font:inherit}
.wrap{display:grid;grid-template-columns:270px 1fr;height:100vh}
.side{background:#fff;border-right:1px solid #e2e8f0;padding:12px;overflow:auto}
h1{font-size:16px;margin:0 0 2px}.sub{color:#688;font-size:11px;margin:0 0 12px}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#789;margin:14px 0 6px;border-top:1px solid #eef;padding-top:10px}
.field,.btn{height:34px;border:1px solid #dde3ea;border-radius:9px;background:#fff;padding:0 9px;outline:none}
.field{width:100%}.btn{cursor:pointer;font-weight:650}.btn.pri{background:#111827;color:#fff;border-color:#111827}
.row{display:flex;gap:6px;margin-bottom:6px}.row>*{flex:1}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pill{border:1px solid #dde3ea;background:#fff;border-radius:999px;padding:4px 8px;font-size:11px;cursor:pointer}
.pill.on{outline:2px solid #111827}.pill i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.sl{display:flex;justify-content:space-between;font-size:11px;margin:6px 0 2px}.rng{width:100%;accent-color:#111827}
.pe,.te{display:grid;grid-template-columns:24px 1fr auto;gap:4px;align-items:center;border:1px solid #eef;border-radius:8px;padding:4px;margin-bottom:4px}
.mini{border:0;background:#eef2f6;border-radius:6px;padding:4px;cursor:pointer}
.th{width:24px;height:24px;border-radius:7px;background:#e9edf2;display:grid;place-items:center;font-size:8px;font-weight:700;object-fit:cover;overflow:hidden}
.col{width:22px;height:22px;border:0;padding:0;background:none}
.main{display:flex;flex-direction:column;min-width:0}
.top{min-height:54px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;gap:7px;align-items:center;padding:6px 12px;flex-wrap:wrap}
.tg{display:flex;background:#eef1f5;border-radius:9px;padding:3px}.tg button{border:0;background:transparent;padding:6px 10px;border-radius:7px;cursor:pointer}.tg .on{background:#fff;box-shadow:0 1px 3px #0002}
.st{margin-left:auto;color:#08795b;font-weight:650;font-size:12px}
.bw{padding:10px;flex:1;min-height:0;display:flex;flex-direction:column}
.sum{display:flex;gap:6px;overflow:auto;padding-bottom:8px}
.card{min-width:92px;background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:7px;cursor:pointer}.card.on{outline:2px solid #111827}
.ct{display:flex;justify-content:space-between;align-items:center}.dot{width:22px;height:22px;border-radius:6px;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800}.cn{font-size:17px;font-weight:750}
.scroll{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:auto;flex:1;min-height:0}
.grid{display:grid;gap:1px;background:#cfd6df;min-width:max-content}
.hd{height:44px;background:#f8fafc;position:sticky;top:0;z-index:10;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:10px;font-weight:700}
.ph{left:0;z-index:20;align-items:flex-start;padding-left:9px}
.per{height:44px;background:#fff;position:sticky;left:0;z-index:5;display:flex;gap:7px;align-items:center;padding:0 8px}
.av{width:30px;height:30px;border-radius:8px;background:#111827;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;object-fit:cover;overflow:hidden}
.per b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}.per small{color:#789}
.cell{height:44px;background:#fff;padding:3px;cursor:crosshair}
.tile{height:100%;border-radius:7px;color:#fff;display:grid;place-items:center;text-align:center;font-size:10px;font-weight:700;overflow:hidden;padding:2px}
.empty{border:1px dashed #cbd3dd;background:#f8fafc;color:#c1cad5}
.ws{border-left:2px solid #8e99a9}
.hide{display:none}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 13px;border-radius:9px;z-index:60}
/* ---- World view (map, equipment, market, countries, shipment) ---- */
:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
body.world .pOnly,body:not(.world) .wOnly{display:none!important}
#modes{flex-wrap:wrap;max-width:100%}
.pctl{display:flex;gap:7px;align-items:center;flex:1 1 620px;min-width:0}
#search{flex:0 1 130px;min-width:80px}#team{flex:0 1 120px;min-width:90px}
#st{flex:1 1 0;min-width:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg [aria-selected=true]{background:#fff;box-shadow:0 1px 3px #0002;font-weight:650}
.btn.sm{height:28px;font-size:11px;padding:0 8px;border-radius:7px}
.wOnly .row,#world .row{align-items:center}
.wlist{max-height:240px;overflow:auto;border:1px solid #eef;border-radius:9px}
.ti{display:grid;grid-template-columns:10px 1fr auto;gap:7px;align-items:center;padding:6px 8px;border:0;border-bottom:1px solid #f1f4f7;background:#fff;width:100%;text-align:left;cursor:pointer}
.ti:hover{background:#f4f7fb}.ti b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ti small{color:#789}.ti span{font-size:11px;color:#567;font-variant-numeric:tabular-nums}
.mk{width:10px;height:10px;border-radius:50%;display:inline-block}
.lb{display:block;font-size:11px;color:#567;margin-bottom:6px}.lb .field{margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hint{font-size:11px;color:#789;margin:0 0 8px;line-height:1.35}.warn{color:#b45309}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.kpi{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:7px 8px}.kpi small{display:block;color:#789;font-size:10px;text-transform:uppercase;letter-spacing:.05em}.kpi b{font-size:15px;font-variant-numeric:tabular-nums}
.wst{margin-left:auto;color:#567;font-size:11px;display:flex;gap:10px;flex-wrap:wrap}.wst i{font-style:normal}.wst .ok{color:#08795b;font-weight:650}.wst .bad{color:#b45309;font-weight:650}
#world{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;overflow:auto}.pad{padding:14px}
#wMap{height:100%;min-height:360px;background:#0b1220}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.eq{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.eq h4{margin:0;font-size:14px}.eq p{margin:0;color:#567;font-size:11px}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:#eef2f6;color:#456;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;margin:0}.kv dt{color:#789}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:auto;margin-bottom:12px}
.box h2{font-size:13px;margin:0;padding:10px 12px;border-bottom:1px solid #eef1f5}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.t th,.t td{padding:6px 10px;border-bottom:1px solid #eef1f5;text-align:right;white-space:nowrap}.t th:first-child,.t td:first-child{text-align:left}
.t th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#789;position:sticky;top:0;background:#f8fafc}
.t th button{all:unset;cursor:pointer}.t tfoot td{font-weight:700;background:#f8fafc}
.t input{width:90px;height:28px;border:1px solid #dde3ea;border-radius:7px;padding:0 6px;text-align:right}
.lk{border:0;background:none;padding:0;color:#1d4ed8;cursor:pointer;text-align:left}.lk:hover{text-decoration:underline}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.mtile{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px}.mtile small{color:#789;font-size:11px}.mtile b{display:block;font-size:22px;margin:4px 0;font-variant-numeric:tabular-nums}
.chUp{color:#b91c1c}.chDn{color:#08795b}.src{font-size:11px;color:#789;line-height:1.5}
.badge{font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px;margin-left:4px}.badge.l{background:#dcfce7;color:#166534}.badge.s{background:#eef2f6;color:#567}
#world sup,.pp sup{color:#9aa;font-size:9px;margin-left:2px}
.wempty{padding:20px;text-align:center;color:#789}
.leaflet-popup-content{font:12px "Segoe UI",Arial,sans-serif;min-width:230px;margin:12px 14px}
.pp h4{margin:0 0 2px;font-size:13px}.pp .kv{margin:8px 0}.pp .row{margin:0}
.err{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:10px;margin:10px}
@media (max-width:820px){.wrap{grid-template-columns:1fr;height:auto}.side{border-right:0;border-bottom:1px solid #e2e8f0}.main{height:100vh}}
</style></head><body>
<div class="wrap">
<aside class="side">
<h1>Location Planner</h1><p class="sub">JSON in / JSON out · terminals, equipment &amp; market</p>
<div class="pOnly">
<h3>Paint with</h3>
<div class="row"><input class="field" id="pin" list="opts" placeholder="HQ or project"><datalist id="opts"></datalist><button class="btn pri" id="use" style="flex:0 0 60px">Use</button></div>
<div class="pills" id="pills"></div>
<div class="sl"><b>Paint width</b><span id="bt">1 day</span></div><input id="brush" class="rng" type="range" min="1" max="8" value="1">
<h3>People</h3>
<div class="row"><input class="field" id="np" placeholder="Add a person"><button class="btn" id="addp" style="flex:0 0 40px">+</button></div>
<div id="plist"></div>
<h3>Tags &amp; colours</h3>
<div class="row"><input class="field" id="nt" placeholder="New tag/project"><button class="btn" id="addt" style="flex:0 0 40px">+</button></div>
<div id="tlist"></div>
<h3>Board size</h3>
<div class="sl"><span>Row</span><span id="rt"></span></div><input id="rs" class="rng" type="range" min="34" max="70" value="44">
<div class="sl"><span>Box</span><span id="ct"></span></div><input id="cs" class="rng" type="range" min="44" max="120" value="70">
<div class="sl"><span>Name</span><span id="nmt"></span></div><input id="ns" class="rng" type="range" min="150" max="360" value="230">
</div>
<div class="wOnly">
<h3>Terminals</h3>
<input class="field" id="wQ" placeholder="Search terminal, port, country, operator" aria-label="Search terminals">
<div class="row" style="margin-top:6px"><select class="field" id="wRegion" aria-label="Region"><option value="">All regions</option></select></div>
<div id="wList" class="wlist" aria-label="Terminal list"></div>
<h3>Shipment builder</h3>
<label class="lb">From terminal<select class="field" id="cFrom"></select></label>
<label class="lb">To terminal<select class="field" id="cTo"></select></label>
<div class="g2"><label class="lb">Equipment<select class="field" id="cEq"></select></label><label class="lb">Boxes<input class="field" id="cQty" type="number" min="1" step="1" value="1"></label></div>
<div class="g2"><label class="lb">Cargo kg / box<input class="field" id="cKg" type="number" min="0" step="100" value="0"></label><label class="lb">Cargo m³ / box<input class="field" id="cM3" type="number" min="0" step="0.5" value="0"></label></div>
<label class="lb">Freight rate per box (USD)<input class="field" id="cRate" type="number" min="0" step="10" placeholder="Enter quoted rate"></label>
<p class="hint" id="cHint"></p>
<div class="row"><button class="btn pri" id="cAdd">Add to shipment</button></div>
<h3>Live totals</h3>
<div class="row"><select class="field" id="wCur" aria-label="Currency"></select><button class="btn" data-tab="vShip">Details</button></div>
<div class="tot" id="wTot"></div>
</div>
</aside>
<section class="main">
<header class="top">
<div class="tg" id="modes" role="tablist" aria-label="Views">
<button role="tab" data-tab="planner" aria-selected="true" class="on">Planner</button>
<button role="tab" data-tab="vMap" aria-selected="false">Map</button>
<button role="tab" data-tab="vEq" aria-selected="false">Equipment</button>
<button role="tab" data-tab="vMkt" aria-selected="false">Market</button>
<button role="tab" data-tab="vCty" aria-selected="false">Countries</button>
<button role="tab" data-tab="vShip" aria-selected="false">Shipment</button>
</div>
<div class="pctl pOnly">
<div class="tg"><button id="daily" class="on">Next 6 weeks</button><button id="weekly">Future</button></div>
<input id="search" class="field" placeholder="Search" style="width:130px">
<select id="team" class="field" style="width:120px"></select>
<span class="st" id="st">Ready</span>
<button class="btn" id="load">Load JSON</button>
<button class="btn pri" id="save">Save JSON</button>
</div>
<div class="wst wOnly" id="wSt" aria-live="polite"></div>
</header>
<div class="bw pOnly"><div class="sum" id="sum"></div><div class="scroll"><div id="board" class="grid"></div></div></div>
<div id="world" class="wOnly">
<div id="wBoot"></div>
<section id="vMap" class="view" role="tabpanel"><div id="wMap"></div></section>
<section id="vEq" class="view pad hide" role="tabpanel"><div class="cards" id="eqCards"></div><p class="src" id="eqSrc"></p></section>
<section id="vMkt" class="view pad hide" role="tabpanel"><div id="mkt"></div></section>
<section id="vCty" class="view pad hide" role="tabpanel"><div id="cty"></div></section>
<section id="vShip" class="view pad hide" role="tabpanel"><div id="ship"></div></section>
</div>
</section></div>
<input id="pf" type="file" accept="image/*" class="hide"><input id="jf" type="file" accept=".json,application/json" class="hide">
<div id="toast" class="toast hide"></div>
<script>
var COLORS=['#3b82f6','#10b981','#f59e0b','#f43f5e','#8b5cf6','#64748b','#06b6d4','#6366f1','#ec4899','#84cc16','#f97316','#14b8a6'];
var DTAGS=[['H','HQ','#3b82f6'],['O','Off Site','#f59e0b'],['V','Vacation','#f43f5e'],['T','Travel','#8b5cf6'],['W','Home','#64748b'],['FAL','Falcon','#10b981'],['NTB','NTB','#06b6d4'],['CEG','CEG','#6366f1']].map(function(x){return{id:x[0],name:x[1],colour:x[2]}});
var DPEOPLE=['Suleyman Iscen|PMO','Maria Zurga|PMO','Mark Lightfoot|Delivery','Jelle Burger|Engineering','Madhura Surve|PMO','Aleksei Sudarev|Engineering','Ali Osman|Delivery','Julia Camargo|Operations'].map(function(x,i){var a=x.split('|');return{id:'p'+(i+1),name:a[0],team:a[1],photo:''}});
var FILE='planner-data.json';
var S={view:'daily',people:DPEOPLE,tags:DTAGS,plan:{},selected:'H',brush:1,filter:'ALL',search:'',team:'All teams',sizes:{row:44,cell:70,name:230}};
var painting=false,photoId=null;
function $(x){return document.getElementById(x)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function tmap(){var m={};S.tags.forEach(function(t){m[t.id]=t});return m}
function mon(d){d=new Date(d);d.setDate(d.getDate()+(d.getDay()===0?-6:1-d.getDay()));d.setHours(0,0,0,0);return d}
function ad(d,n){return new Date(d.getTime()+n*86400000)}
function iso(d){return d.toISOString().slice(0,10)}
var base=mon(new Date());
var days=[];for(var i=0;i<30;i++)days.push(ad(base,i+Math.floor(i/5)*2));
var weeks=[];for(var i=0;i<18;i++)weeks.push(ad(base,(6+i)*7));
function dates(){return S.view==='daily'?days:weeks}
function mode(){return S.view==='daily'?'D':'W'}
function key(p,d){return p+'|'+mode()+'|'+iso(d)}
function wn(d){var x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var q=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-q);var y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function seed(){if(Object.keys(S.plan).length)return;var z=S.tags.map(function(t){return t.id});S.people.forEach(function(p,a){days.forEach(function(d,i){S.plan[p.id+'|D|'+iso(d)]=z[(a+i)%z.length]});weeks.forEach(function(d,i){S.plan[p.id+'|W|'+iso(d)]=z[(a+i+2)%z.length]})})}
function toast(x){$('toast').textContent=x;$('toast').classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(function(){$('toast').classList.add('hide')},2000)}
function status(msg,warn){$('st').textContent=msg;$('st').style.color=warn?'#b45309':'#08795b'}
function choose(id){S.selected=id;var m=tmap();$('pin').value=m[id]?m[id].name:'';renderPaint()}
function addTag(name){name=(name||'').trim();if(!name)return;var ex=null;S.tags.forEach(function(t){if(t.name.toLowerCase()===name.toLowerCase()||t.id.toLowerCase()===name.toLowerCase())ex=t});if(ex){choose(ex.id);return}var id='t'+Date.now();S.tags.push({id:id,name:name,colour:COLORS[S.tags.length%COLORS.length]});choose(id);render();toast('Tag created')}
function renderPaint(){var m=tmap(),cur=m[S.selected];$('opts').innerHTML=S.tags.map(function(t){return '<option value="'+esc(t.name)+'">'}).join('');$('pills').innerHTML=S.tags.map(function(t){return '<button class="pill '+(S.selected===t.id?'on':'')+'" data-id="'+t.id+'"><i style="background:'+t.colour+'"></i>'+esc(t.name)+'</button>'}).join('');[].forEach.call(document.querySelectorAll('.pill'),function(b){b.onclick=function(){choose(b.getAttribute('data-id'))}});$('bt').textContent=S.brush+' '+(S.view==='daily'?(S.brush===1?'day':'days'):(S.brush===1?'week':'weeks'))}
function filtered(){return S.people.filter(function(p){var t=p.name.toLowerCase().indexOf(S.search.toLowerCase())>=0;var tm=S.team==='All teams'||p.team===S.team;var f=S.filter==='ALL'||dates().some(function(d){return S.plan[key(p.id,d)]===S.filter});return t&&tm&&f})}
function renderPeople(){$('plist').innerHTML=S.people.map(function(p,i){var ini=p.name.split(' ').map(function(x){return x[0]}).slice(0,2).join('');var th=p.photo?'<img class="th" src="'+p.photo+'">':'<span class="th">'+esc(ini)+'</span>';return '<div class="pe"><button class="mini pic" data-id="'+p.id+'">'+th+'</button><div><input class="field pn" data-id="'+p.id+'" value="'+esc(p.name)+'" style="height:26px"><input class="field pt" data-id="'+p.id+'" value="'+esc(p.team||'')+'" placeholder="Team" style="height:23px;margin-top:2px;font-size:11px"></div><div><button class="mini up" data-i="'+i+'">&#9650;</button><button class="mini dn" data-i="'+i+'">&#9660;</button><button class="mini del" data-id="'+p.id+'">&#215;</button></div></div>'}).join('');
[].forEach.call(document.querySelectorAll('.pn'),function(x){x.onchange=function(){find(x.getAttribute('data-id')).name=x.value;renderBoard()}});
[].forEach.call(document.querySelectorAll('.pt'),function(x){x.onchange=function(){find(x.getAttribute('data-id')).team=x.value;render()}});
[].forEach.call(document.querySelectorAll('.up'),function(b){b.onclick=function(){mv(+b.getAttribute('data-i'),-1)}});
[].forEach.call(document.querySelectorAll('.dn'),function(b){b.onclick=function(){mv(+b.getAttribute('data-i'),1)}});
[].forEach.call(document.querySelectorAll('.del'),function(b){b.onclick=function(){if(confirm('Remove this person?')){S.people=S.people.filter(function(p){return p.id!==b.getAttribute('data-id')});render()}}});
[].forEach.call(document.querySelectorAll('.pic'),function(b){b.onclick=function(){photoId=b.getAttribute('data-id');$('pf').click()}})}
function find(id){var r=null;S.people.forEach(function(p){if(p.id===id)r=p});return r}
function mv(i,d){var j=i+d;if(j<0||j>=S.people.length)return;var t=S.people[i];S.people[i]=S.people[j];S.people[j]=t;render()}
function renderTags(){$('tlist').innerHTML=S.tags.map(function(t){return '<div class="te"><input class="col" type="color" value="'+t.colour+'" data-id="'+t.id+'"><input class="field tn" value="'+esc(t.name)+'" data-id="'+t.id+'" style="height:26px"><button class="mini delt" data-id="'+t.id+'">&#215;</button></div>'}).join('');
[].forEach.call(document.querySelectorAll('.col'),function(x){x.oninput=function(){ftag(x.getAttribute('data-id')).colour=x.value;renderPaint();renderBoard();renderSum()}});
[].forEach.call(document.querySelectorAll('.tn'),function(x){x.onchange=function(){ftag(x.getAttribute('data-id')).name=x.value;render()}});
[].forEach.call(document.querySelectorAll('.delt'),function(b){b.onclick=function(){if(confirm('Remove tag and clear its boxes?')){var id=b.getAttribute('data-id');var np={};Object.keys(S.plan).forEach(function(k){if(S.plan[k]!==id)np[k]=S.plan[k]});S.plan=np;S.tags=S.tags.filter(function(t){return t.id!==id});if(S.selected===id)S.selected='';render()}}})}
function ftag(id){var r=null;S.tags.forEach(function(t){if(t.id===id)r=t});return r}
function renderFilters(){var set={};S.people.forEach(function(p){if(p.team)set[p.team]=1});var teams=['All teams'].concat(Object.keys(set));$('team').innerHTML=teams.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');$('team').value=S.team}
function renderSum(){var m=tmap();$('sum').innerHTML=S.tags.map(function(t){var n=S.people.filter(function(p){return S.plan[key(p.id,dates()[0])]===t.id}).length;return '<button class="card '+(S.filter===t.id?'on':'')+'" data-id="'+t.id+'"><div class="ct"><span class="dot" style="background:'+t.colour+'">'+esc(t.name.slice(0,2).toUpperCase())+'</span><span class="cn">'+n+'</span></div><div style="margin-top:4px;font-weight:650">'+esc(t.name)+'</div></button>'}).join('');
[].forEach.call(document.querySelectorAll('.card'),function(b){b.onclick=function(){var id=b.getAttribute('data-id');S.filter=S.filter===id?'ALL':id;renderSum();renderBoard()}})}
function paint(pid,i){for(var o=0;o<S.brush&&i+o<dates().length;o++)S.plan[key(pid,dates()[i+o])]=S.selected||'';status('Unsaved changes',true);renderBoard();renderSum()}
function renderBoard(){var ds=dates(),ps=filtered(),m=tmap();$('board').style.gridTemplateColumns='var(--name,230px) repeat('+ds.length+',var(--cell,70px))';
var h='<div class="hd ph">Person</div>';
ds.forEach(function(d,i){h+='<div class="hd '+(S.view==='daily'&&i%5===0?'ws':'')+'"><span>W'+wn(d)+'</span><span>'+(S.view==='daily'?d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit'}):d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}))+'</span></div>'});
ps.forEach(function(p){var ini=p.name.split(' ').map(function(x){return x[0]}).slice(0,2).join('');h+='<div class="per">'+(p.photo?'<img class="av" src="'+p.photo+'">':'<span class="av">'+esc(ini)+'</span>')+'<div style="min-width:0"><b>'+esc(p.name)+'</b><small>'+esc(p.team||'')+'</small></div></div>';
ds.forEach(function(d,i){var t=m[S.plan[key(p.id,d)]];h+='<div class="cell '+(S.view==='daily'&&i%5===0?'ws':'')+'" data-p="'+p.id+'" data-i="'+i+'"><div class="tile '+(t?'':'empty')+'" style="'+(t?'background:'+t.colour:'')+'">'+(t?esc(t.name):'+')+'</div></div>'})});
$('board').innerHTML=h;
[].forEach.call(document.querySelectorAll('.cell'),function(c){c.onmousedown=function(e){e.preventDefault();painting=true;paint(c.getAttribute('data-p'),+c.getAttribute('data-i'))};c.onmouseenter=function(){if(painting)paint(c.getAttribute('data-p'),+c.getAttribute('data-i'))}})}
function sizes(){document.documentElement.style.setProperty('--row',S.sizes.row+'px');document.documentElement.style.setProperty('--cell',S.sizes.cell+'px');document.documentElement.style.setProperty('--name',S.sizes.name+'px');document.querySelectorAll('.per,.cell,.av').forEach&&null;$('rt').textContent=S.sizes.row+' px';$('ct').textContent=S.sizes.cell+' px';$('nmt').textContent=S.sizes.name+' px';
var st=document.getElementById('dynsz');if(!st){st=document.createElement('style');st.id='dynsz';document.head.appendChild(st)}st.textContent='.per,.cell,.tile{height:'+S.sizes.row+'px}.av{width:'+(S.sizes.row-14)+'px;height:'+(S.sizes.row-14)+'px}'}
function render(){sizes();renderFilters();renderPaint();renderPeople();renderTags();renderSum();renderBoard();$('daily').className=S.view==='daily'?'on':'';$('weekly').className=S.view==='weekly'?'on':''}
function applyState(o){if(!o||!o.people||!o.tags)throw new Error('bad');S={view:o.view||'daily',people:o.people,tags:o.tags,plan:o.plan||{},selected:o.selected||(o.tags[0]&&o.tags[0].id)||'',brush:o.brush||1,filter:'ALL',search:'',team:'All teams',sizes:o.sizes||{row:44,cell:70,name:230}};$('brush').value=S.brush;$('rs').value=S.sizes.row;$('cs').value=S.sizes.cell;$('ns').value=S.sizes.name}
function saveJson(){var data=JSON.stringify(S,null,2);var blob=new Blob([data],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=FILE;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},800);status('Saved');toast('Saved '+FILE+' - upload it next to this page to share')}
function loadObj(o,src){try{applyState(o);seed();render();status('Loaded from '+src);toast('Loaded from '+src)}catch(e){toast('Not a valid planner file')}}
function loadFile(f){var r=new FileReader();r.onload=function(){try{loadObj(JSON.parse(r.result),f.name)}catch(e){toast('Could not read file')}};r.readAsText(f)}
function autoLoad(){fetch(FILE+'?cb='+Date.now(),{cache:'no-store'}).then(function(res){if(res.ok)return res.json();throw 0}).then(function(o){loadObj(o,FILE)}).catch(function(){seed();render();status('New planner (sample data)')})}
$('use').onclick=function(){addTag($('pin').value)};
$('pin').onkeydown=function(e){if(e.key==='Enter')addTag(e.target.value)};
$('brush').oninput=function(e){S.brush=+e.target.value;renderPaint()};
$('addp').onclick=function(){var n=$('np').value.trim();if(!n)return;S.people.push({id:'p'+Date.now(),name:n,team:'',photo:''});$('np').value='';render()};
$('addt').onclick=function(){addTag($('nt').value);$('nt').value=''};
$('daily').onclick=function(){S.view='daily';render()};
$('weekly').onclick=function(){S.view='weekly';render()};
$('search').oninput=function(e){S.search=e.target.value;renderBoard()};
$('team').onchange=function(e){S.team=e.target.value;renderBoard()};
$('rs').oninput=function(e){S.sizes.row=+e.target.value;sizes();renderBoard()};
$('cs').oninput=function(e){S.sizes.cell=+e.target.value;sizes();renderBoard()};
$('ns').oninput=function(e){S.sizes.name=+e.target.value;sizes();renderBoard()};
$('pf').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){find(photoId).photo=r.result;render()};r.readAsDataURL(f);e.target.value=''};
$('save').onclick=saveJson;
$('load').onclick=function(){$('jf').click()};
$('jf').onchange=function(e){var f=e.target.files[0];if(f)loadFile(f);e.target.value=''};
window.onmouseup=function(){painting=false};
autoLoad();
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function(){'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(v,d=0)=>v==null||isNaN(v)?'–':Number(v).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function getJSON(u,ms=15000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal,cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).finally(()=>clearTimeout(t))}

const IND={
 'FP.CPI.TOTL.ZG':{n:'Inflation',u:'CPI, annual %',d:1},
 'PA.NUS.PPPC.RF':{n:'Price level',u:'vs US (US = 1.00)',d:2},
 'LP.LPI.OVRL.XQ':{n:'LPI',u:'Logistics Performance, 1–5',d:2},
 'IS.SHP.GOOD.TU':{n:'Port traffic',u:'TEU / year',d:0},
 'NY.GDP.PCAP.CD':{n:'GDP / capita',u:'current US$',d:0}};
const CURS=['USD','EUR','GBP','DKK','TRY','CNY','SGD','AED','INR','JPY','BRL'];
const S={terms:[],byId:{},eq:[],eqBy:{},rates:null,baseRates:null,ctry:null,ind:{},fx:{USD:1},fxTime:null,
 cur:store.get('wtm.cur','USD'),lines:store.get('wtm.lines',[]),sort:{k:'teu',d:-1},live:{wb:'…',fx:'…'},rateManual:false};
let map,markerLayer,routeLayer,marks={};

/* ---------- geo ---------- */
const R=Math.PI/180;
function gcDist(a,b){const p1=a.lat*R,p2=b.lat*R,dp=p2-p1,dl=(b.lon-a.lon)*R;return 2*6371*Math.asin(Math.sqrt(Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2))}
function gcPath(a,b,n=96){
 const p1=a.lat*R,l1=a.lon*R,p2=b.lat*R,l2=b.lon*R,d=gcDist(a,b)/6371;if(d<1e-6)return[[a.lat,a.lon]];
 const out=[];let prev=null;
 for(let i=0;i<=n;i++){const f=i/n,A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
  const x=A*Math.cos(p1)*Math.cos(l1)+B*Math.cos(p2)*Math.cos(l2),y=A*Math.cos(p1)*Math.sin(l1)+B*Math.cos(p2)*Math.sin(l2),z=A*Math.sin(p1)+B*Math.sin(p2);
  let lat=Math.atan2(z,Math.hypot(x,y))/R,lon=Math.atan2(y,x)/R;
  if(prev!==null){while(lon-prev>180)lon-=360;while(lon-prev<-180)lon+=360}prev=lon;out.push([lat,lon])}
 return out}

/* ---------- money ---------- */
function money(usd,cur=S.cur){if(usd==null||isNaN(usd))return'–';const r=S.fx[cur]??1,c=S.fx[cur]?cur:'USD';
 try{return new Intl.NumberFormat('en-GB',{style:'currency',currency:c,maximumFractionDigits:0}).format(usd*r)}catch(e){return c+' '+nf(usd*r)}}

/* ---------- status ---------- */
function status(){
 const r=S.rates?`Rates file updated <b>${esc(S.rates.asOf)}</b>${S.rates.edited?' (edited)':''}`:'Rates: none';
 const cls=v=>v==='live'?'ok':v==='…'?'':'bad';
 $('#wSt').innerHTML=`<i>${r}</i><i>Country data: <span class="${cls(S.live.wb)}">${esc(S.live.wb)}</span></i><i>FX: <span class="${cls(S.live.fx)}">${esc(S.live.fx)}</span></i>`}

/* ---------- tabs ---------- */
async function tab(id){
 $$('#modes [role=tab]').forEach(b=>{const on=b.dataset.tab===id;b.setAttribute('aria-selected',on);b.classList.toggle('on',on)});
 document.body.classList.toggle('world',id!=='planner');store.set('wtm.mode',id);
 if(id==='planner')return;
 await boot();
 $$('#world .view').forEach(v=>v.classList.toggle('hide',v.id!==id));
 if(id==='vMap'){if(!map){initMap();renderList();drawRoutes()}else setTimeout(()=>map.invalidateSize(),0)}}

/* ---------- terminals list + markers ---------- */
const REGC={'Asia':'#f59e0b','Middle East':'#a855f7','Europe':'#06b6d4','Africa':'#22c55e','North America':'#ef4444','Latin America':'#ec4899','Oceania':'#3b82f6'};
const colourOf=t=>REGC[t.region]||'#94a3b8';
const radiusOf=t=>5+Math.sqrt(t.teu_m||0.5)*2.2;
function filtered(){const q=$('#wQ').value.trim().toLowerCase(),rg=$('#wRegion').value;
 return S.terms.filter(t=>(!rg||t.region===rg)&&(!q||[t.name,t.port,t.country,t.operator,t.iso2,t.iso3].join(' ').toLowerCase().includes(q)))
  .sort((a,b)=>(b.teu_m||0)-(a.teu_m||0))}
function renderList(){const f=filtered();
 $('#wList').innerHTML=f.length?f.map(t=>`<button class="ti" data-act="fly" data-id="${esc(t.id)}"><i class="mk" style="background:${colourOf(t)}"></i><div><b>${esc(t.name)}</b><small>${esc(t.port)}, ${esc(t.country)}</small></div><span>${t.teu_m!=null?nf(t.teu_m,1)+'M':''}</span></button>`).join(''):'<p class="wempty">No terminals match.</p>';
 if(markerLayer){markerLayer.clearLayers();f.forEach(t=>marks[t.id]&&markerLayer.addLayer(marks[t.id]))}}

function indLine(iso3){const o=S.ind[iso3];if(!o)return'';
 return Object.entries(IND).filter(([k])=>o[k]).map(([k,m])=>`<dt>${m.n}</dt><dd>${nf(o[k].v,m.d)}<sup>${esc(o[k].y)}</sup></dd>`).join('')}
function popup(t){
 return `<div class="pp"><h4>${esc(t.name)}</h4><div style="color:#567">${esc(t.port)}, ${esc(t.country)}</div>
 <dl class="kv"><dt>Operator</dt><dd>${esc(t.operator||'–')}</dd><dt>Port throughput</dt><dd>${t.teu_m!=null?nf(t.teu_m,1)+' M TEU':'–'}${t.teu_year?`<sup>${esc(t.teu_year)}</sup>`:''}</dd>
 <dt>Max draft</dt><dd>${t.maxDraft_m!=null?nf(t.maxDraft_m,1)+' m':'–'}</dd><dt>Position</dt><dd>${nf(t.lat,3)}, ${nf(t.lon,3)}${t.pos==='approx'?' <span class="warn" title="Not checked against imagery; may be up to ~1 km off the quay">approx.</span>':''}</dd>${indLine(t.iso3)}</dl>${t.note?`<p class="hint" style="margin:0 0 8px">${esc(t.note)}</p>`:''}
 <div class="row"><button class="btn sm" data-act="zoom" data-id="${esc(t.id)}">Satellite zoom</button><button class="btn sm" data-act="from" data-id="${esc(t.id)}">From</button><button class="btn sm" data-act="to" data-id="${esc(t.id)}">To</button></div></div>`}

function initMap(){
 if(!window.L){$('#wMap').innerHTML='<div class="err">The map library (Leaflet from unpkg.com) could not load. Terminals, rates and the calculator still work.</div>';return}
 const esri=p=>`https://server.arcgisonline.com/ArcGIS/rest/services/${p}/MapServer/tile/{z}/{y}/{x}`;
 const sat=L.tileLayer(esri('World_Imagery'),{maxZoom:19,attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'});
 const street=L.tileLayer(esri('World_Street_Map'),{maxZoom:19,attribution:'&copy; Esri'});
 const labels=L.tileLayer(esri('Reference/World_Boundaries_and_Places'),{maxZoom:19});
 const sea=L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',{maxZoom:18,attribution:'Sea marks &copy; OpenSeaMap'});
 map=L.map('wMap',{worldCopyJump:true,minZoom:2,zoomSnap:.5}).setView([22,30],2.5);
 sat.addTo(map);labels.addTo(map);
 L.control.layers({'Satellite':sat,'Streets':street},{'Place labels':labels,'Sea marks (OpenSeaMap)':sea},{collapsed:true}).addTo(map);
 L.control.scale({imperial:false}).addTo(map);
 const lg=L.control({position:'bottomright'});lg.onAdd=()=>{const d=L.DomUtil.create('div');d.style.cssText='background:#fff;padding:6px 8px;border-radius:8px;font-size:11px;line-height:1.6';
  d.innerHTML=Object.entries(REGC).map(([r,c])=>`<div><i class="mk" style="background:${c}"></i> ${r}</div>`).join('')+'<div style="color:#789">Size = port TEU</div><div style="color:#789">Most positions approximate (±1 km)</div>';return d};lg.addTo(map);
 markerLayer=L.layerGroup().addTo(map);routeLayer=L.layerGroup().addTo(map);
 S.terms.forEach(t=>{marks[t.id]=L.circleMarker([t.lat,t.lon],{radius:radiusOf(t),color:'#fff',weight:1.5,fillColor:colourOf(t),fillOpacity:.9})
  .bindTooltip(esc(t.name)).bindPopup(()=>popup(t),{maxWidth:300})});
}
async function fly(id,z=6){const t=S.byId[id];if(!t)return;await tab('vMap');if(!map)return;
 map.flyTo([t.lat,t.lon],z,{duration:z>10?2.2:1.2});map.once('moveend',()=>marks[t.id]&&markerLayer.hasLayer(marks[t.id])&&marks[t.id].openPopup())}

/* ---------- routes ---------- */
function drawRoutes(){if(!routeLayer)return;routeLayer.clearLayers();
 S.lines.forEach(l=>{const a=S.byId[l.from],b=S.byId[l.to];if(a&&b)L.polyline(gcPath(a,b),{color:'#a5f3fc',weight:2,opacity:.85,dashArray:'4 6'}).addTo(routeLayer)});
 const a=S.byId[$('#cFrom').value],b=S.byId[$('#cTo').value];
 if(a&&b&&a!==b)L.polyline(gcPath(a,b),{color:'#fde047',weight:3,opacity:.95}).bindTooltip(`${nf(gcDist(a,b))} km great-circle`).addTo(routeLayer)}

/* ---------- lanes ---------- */
const norm=s=>String(s||'').toLowerCase();
function matchPort(t,name){const p=norm(t.port),n=norm(name);return p&&n&&(p.includes(n)||n.includes(p.split(/[ (/,]/)[0]))}
const inC=(t,list)=>Array.isArray(list)&&list.includes(t.iso2);
function laneFor(a,b){const L=S.rates?.lanes||[];return L.find(l=>matchPort(a,l.from)&&matchPort(b,l.to))||L.find(l=>inC(a,l.fromCountries)&&inC(b,l.toCountries))}

/* ---------- builder ---------- */
function opts(){
 const regs=[...new Set(S.terms.map(t=>t.region))].sort();
 $('#wRegion').insertAdjacentHTML('beforeend',regs.map(r=>`<option>${esc(r)}</option>`).join(''));
 const grouped=regs.map(r=>`<optgroup label="${esc(r)}">${S.terms.filter(t=>t.region===r).sort((a,b)=>a.port.localeCompare(b.port)).map(t=>`<option value="${esc(t.id)}">${esc(t.port)} – ${esc(t.name)}</option>`).join('')}</optgroup>`).join('');
 $('#cFrom').innerHTML=grouped;$('#cTo').innerHTML=grouped;
 const pick=(re,fb)=>(S.terms.find(t=>re.test(t.port))||S.terms[fb]||{}).id;
 $('#cFrom').value=store.get('wtm.from',pick(/shanghai/i,0));$('#cTo').value=store.get('wtm.to',pick(/rotterdam/i,1));
 $('#cEq').innerHTML=S.eq.map(e=>`<option value="${esc(e.code)}">${esc(e.name)}</option>`).join('');
 if(S.eqBy['40HC'])$('#cEq').value='40HC';
 renderCur()}
function renderCur(){$('#wCur').innerHTML=CURS.filter(c=>S.fx[c]).map(c=>`<option ${c===S.cur?'selected':''}>${c}</option>`).join('');if(!S.fx[S.cur])S.cur='USD'}

function suggest(){
 const a=S.byId[$('#cFrom').value],b=S.byId[$('#cTo').value],e=S.eqBy[$('#cEq').value],h=$('#cHint');
 if(!a||!b||!e){h.textContent='';return}
 const lane=laneFor(a,b),parts=[`Great-circle distance ${nf(gcDist(a,b))} km (sea route is longer).`];
 if(lane){parts.push(`Published lane: ${lane.from} → ${lane.to} ${money(lane.usd40,'USD')}/40ft (${lane.date}).`);
  if(e.teu>=2&&!S.rateManual)$('#cRate').value=lane.usd40;
  if(e.teu<2)parts.push('Index is per 40ft — enter your 20ft quote.');
  if(e.category!=='Dry')parts.push('Index covers dry boxes; reefer/special rates differ.')}
 else parts.push('No published index lane for this pair — enter your quoted rate.');
 h.textContent=parts.join(' ');drawRoutes()}

function lineCalc(l){const e=S.eqBy[l.eq]||{},a=S.byId[l.from],b=S.byId[l.to];
 return{e,a,b,teu:(e.teu||0)*l.qty,freight:l.rate*l.qty,cargo:l.kg*l.qty,gross:(l.kg+(e.tare_kg||0))*l.qty,vol:l.m3*l.qty,cap:(e.cbm||0)*l.qty,
  over:e.payload_kg&&l.kg>e.payload_kg,overV:e.cbm&&l.m3>e.cbm,dist:a&&b?gcDist(a,b):null}}
function totals(){const T={boxes:0,teu:0,freight:0,cargo:0,gross:0,vol:0,cap:0,warn:0};
 S.lines.forEach(l=>{const c=lineCalc(l);T.boxes+=l.qty;T.teu+=c.teu;T.freight+=c.freight;T.cargo+=c.cargo;T.gross+=c.gross;T.vol+=c.vol;T.cap+=c.cap;if(c.over||c.overV)T.warn++});return T}
function renderTot(){const T=totals();
 $('#wTot').innerHTML=`<div class="kpi"><small>Boxes</small><b>${nf(T.boxes)}</b></div><div class="kpi"><small>TEU</small><b>${nf(T.teu,T.teu%1?2:0)}</b></div>
 <div class="kpi" style="grid-column:span 2"><small>Freight total</small><b>${money(T.freight)}</b></div>
 <div class="kpi"><small>Gross weight</small><b>${nf(T.gross/1000,1)} t</b></div><div class="kpi"><small>Volume use</small><b>${T.cap&&T.vol?nf(T.vol/T.cap*100)+'%':'–'}</b></div>
 ${T.warn?`<p class="hint warn" style="grid-column:span 2">${T.warn} line(s) exceed box payload or volume.</p>`:''}`;
 renderShip();drawRoutes()}
function addLine(){const v=id=>+$(id).value||0,l={id:Date.now().toString(36),from:$('#cFrom').value,to:$('#cTo').value,eq:$('#cEq').value,qty:Math.max(1,Math.round(v('#cQty'))),rate:v('#cRate'),kg:v('#cKg'),m3:v('#cM3')};
 if(l.from===l.to){$('#cHint').textContent='Pick two different terminals.';return}
 S.lines.push(l);store.set('wtm.lines',S.lines);renderTot()}

/* ---------- shipment view (aggregation) ---------- */
function groupBy(fn){const m=new Map();S.lines.forEach(l=>{const c=lineCalc(l),k=fn(l,c);const g=m.get(k)||{k,boxes:0,teu:0,freight:0,gross:0};g.boxes+=l.qty;g.teu+=c.teu;g.freight+=c.freight;g.gross+=c.gross;m.set(k,g)});return[...m.values()].sort((a,b)=>b.freight-a.freight)}
function renderShip(){
 if(!S.lines.length){$('#ship').innerHTML='<div class="box"><p class="wempty">No shipment lines yet. Use the <b>Shipment builder</b> on the left, or pick terminals on the map (From / To).</p></div>';return}
 const T=totals();
 const rows=S.lines.map(l=>{const c=lineCalc(l);return`<tr><td>${esc(c.a?.port||l.from)} → ${esc(c.b?.port||l.to)}</td><td>${esc(l.eq)}</td><td>${nf(l.qty)}</td><td>${nf(c.teu,c.teu%1?2:0)}</td><td>${money(l.rate)}</td><td><b>${money(c.freight)}</b></td>
  <td class="${c.over?'warn':''}">${nf(l.kg)}${c.over?' ⚠':''}</td><td class="${c.overV?'warn':''}">${c.e.cbm&&l.m3?nf(l.m3/c.e.cbm*100)+'%':'–'}${c.overV?' ⚠':''}</td><td>${nf(c.dist)}</td><td>${nf(c.gross/1000,1)}</td>
  <td><button class="btn sm" data-act="del" data-id="${esc(l.id)}" aria-label="Remove line">Remove</button></td></tr>`}).join('');
 const grp=(title,data)=>`<div class="box"><h2>${title}</h2><table class="t"><thead><tr><th>Group</th><th>Boxes</th><th>TEU</th><th>Gross t</th><th>Freight</th><th>Share</th></tr></thead><tbody>${data.map(g=>`<tr><td>${esc(g.k)}</td><td>${nf(g.boxes)}</td><td>${nf(g.teu,g.teu%1?2:0)}</td><td>${nf(g.gross/1000,1)}</td><td>${money(g.freight)}</td><td>${T.freight?nf(g.freight/T.freight*100)+'%':'–'}</td></tr>`).join('')}</tbody></table></div>`;
 $('#ship').innerHTML=`<div class="row" style="justify-content:flex-end"><span></span><button class="btn" data-act="csv" style="flex:0 0 auto">Export CSV</button><button class="btn" data-act="clear" style="flex:0 0 auto">Clear all</button></div>
 <div class="box"><h2>Shipment lines</h2><table class="t"><thead><tr><th>Route</th><th>Equip.</th><th>Boxes</th><th>TEU</th><th>Rate / box</th><th>Freight</th><th>Cargo kg / box</th><th>Volume use</th><th>Distance km</th><th>Gross t</th><th></th></tr></thead>
 <tbody>${rows}</tbody><tfoot><tr><td>Total</td><td></td><td>${nf(T.boxes)}</td><td>${nf(T.teu,T.teu%1?2:0)}</td><td></td><td>${money(T.freight)}</td><td>${nf(T.cargo)}</td><td>${T.cap&&T.vol?nf(T.vol/T.cap*100)+'%':'–'}</td><td></td><td>${nf(T.gross/1000,1)}</td><td></td></tr></tfoot></table></div>
 <div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(380px,1fr))">${grp('By equipment',groupBy(l=>l.eq))}${grp('By destination country',groupBy((l,c)=>c.b?.country||'?'))}${grp('By origin port',groupBy((l,c)=>c.a?.port||'?'))}</div>
 <p class="src">Freight in ${esc(S.cur)}${S.cur!=='USD'?` at ${S.fx[S.cur]} per USD (${esc(S.fxTime||'')})`:''}. Distances are great-circle, not sea routes. Gross weight = cargo + container tare.</p>`}
function csv(){const h=['from_terminal','from_port','to_terminal','to_port','equipment','boxes','teu','rate_usd_per_box','freight_usd','cargo_kg_per_box','gross_kg','distance_km_gc'];
 const q=v=>{const s=String(v??'');return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const body=S.lines.map(l=>{const c=lineCalc(l);return[c.a?.name,c.a?.port,c.b?.name,c.b?.port,l.eq,l.qty,c.teu,l.rate,c.freight,l.kg,c.gross,Math.round(c.dist||0)].map(q).join(',')});
 download('shipment.csv',[h.join(','),...body].join('\n'),'text/csv')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ---------- equipment ---------- */
function eqSvg(e){const s=210/13.716,l=e.ext.l*s,h=e.ext.h*s,c={Dry:'#64748b',Reefer:'#e2e8f0',Special:'#f59e0b',Tank:'#94a3b8'}[e.category]||'#64748b';
 const ribs=e.category==='Tank'?`<ellipse cx="${4+l/2}" cy="${6+h/2}" rx="${l/2-6}" ry="${h/2-3}" fill="#cbd5e1" stroke="#475569"/>`:
  e.code.includes('FR')||/flat|platform/i.test(e.name)?'':Array.from({length:Math.floor(l/6)},(_,i)=>`<line x1="${8+i*6}" y1="${9}" x2="${8+i*6}" y2="${3+h}" stroke="#0002"/>`).join('');
 const body=/platform/i.test(e.name)?`<rect x="4" y="${h-2}" width="${l}" height="8" fill="${c}" rx="1"/>`:/flat/i.test(e.name)?`<rect x="4" y="${h-2}" width="${l}" height="8" fill="${c}" rx="1"/><rect x="4" y="6" width="5" height="${h}" fill="${c}"/><rect x="${l-1}" y="6" width="5" height="${h}" fill="${c}"/>`:
  `<rect x="4" y="6" width="${l}" height="${h}" fill="${e.category==='Tank'?'none':c}" stroke="#334155" rx="1"/>${ribs}${/open top/i.test(e.name)?`<rect x="4" y="4" width="${l}" height="4" fill="#38bdf8"/>`:''}${e.category==='Reefer'?`<rect x="4" y="8" width="10" height="${h-4}" fill="#0ea5e9"/>`:''}`;
 return`<svg viewBox="0 0 220 ${h+16}" width="100%" height="${h+16}" role="img" aria-label="${esc(e.name)} side profile to scale">${body}<line x1="4" y1="${h+12}" x2="${4+l}" y2="${h+12}" stroke="#94a3b8"/><text x="${4+l/2}" y="${h+11}" font-size="8" text-anchor="middle" fill="#567" dy="-1">${nf(e.ext.l,2)} m</text></svg>`}
function renderEq(){
 $('#eqCards').innerHTML=S.eq.map(e=>`<article class="eq"><div class="row" style="margin:0"><h4>${esc(e.name)}</h4><span class="tag" style="flex:0 0 auto">${esc(e.code)} · ISO ${esc(e.iso)}</span></div>${eqSvg(e)}<p>${esc(e.notes)}</p>
 <dl class="kv"><dt>Internal L × W × H</dt><dd>${nf(e.int?.l,2)} × ${nf(e.int?.w,2)} × ${nf(e.int?.h,2)} m</dd>${e.door?`<dt>Door W × H</dt><dd>${nf(e.door.w,2)} × ${nf(e.door.h,2)} m</dd>`:''}
 <dt>${e.category==='Tank'?'Capacity':'Volume'}</dt><dd>${nf(e.cbm,1)} m³</dd><dt>Tare</dt><dd>${nf(e.tare_kg)} kg</dd><dt>Max payload</dt><dd>${nf(e.payload_kg)} kg</dd><dt>Max gross</dt><dd>${nf(e.maxGross_kg)} kg</dd>
 ${e.tempRange_c?`<dt>Temperature</dt><dd>${e.tempRange_c[0]} to +${e.tempRange_c[1]} °C</dd>`:''}<dt>TEU</dt><dd>${e.teu}</dd></dl>
 <button class="btn sm" data-act="useq" data-id="${esc(e.code)}">Use in shipment builder</button></article>`).join('')||'<p class="wempty">No equipment data.</p>';
 $('#eqSrc').textContent='Drawings share one scale. Typical values; exact tare and payload vary by carrier and build year — check the CSC plate on the box.'}

/* ---------- market ---------- */
function chg(p){return p==null?'':`<span class="${p>0?'chUp':p<0?'chDn':''}">${p>0?'▲':p<0?'▼':''} ${nf(Math.abs(p),1)}%</span>`}
function renderMkt(){const r=S.rates;
 if(!r){$('#mkt').innerHTML='<div class="box"><p class="wempty">No rates file found (data/rates.json).</p></div>';return}
 const fxRows=CURS.filter(c=>c!=='USD'&&S.fx[c]).map(c=>`<tr><td>USD → ${c}</td><td>${nf(S.fx[c],c==='JPY'?2:4)}</td></tr>`).join('');
 $('#mkt').innerHTML=`<div class="mtiles">${(r.indices||[]).map(i=>`<div class="mtile"><small>${esc(i.name)}</small><b>${i.unit&&/usd/i.test(i.unit)?money(i.value,'USD'):nf(i.value,2)}</b><small>${esc(i.unit||'')} · ${esc(i.date)} ${chg(i.wow_pct)}</small></div>`).join('')}</div>
 <div class="box"><h2>Spot lanes — USD per 40ft (editable)</h2><table class="t"><thead><tr><th>Lane</th><th>USD / 40ft</th><th>In ${esc(S.cur)}</th><th>Week change</th><th>Date</th><th>Source</th></tr></thead><tbody>
 ${(r.lanes||[]).map((l,i)=>`<tr><td title="${esc(l.note||'')}">${esc(l.from)} → ${esc(l.to)}${l.note?' <span class="src">*</span>':''}</td><td><input type="number" min="0" step="1" value="${esc(l.usd40)}" data-lane="${i}" aria-label="${esc(l.from)} to ${esc(l.to)} rate"></td><td>${money(l.usd40)}</td><td>${chg(l.wow_pct)}</td><td>${esc(l.date)}</td><td>${l.source?`<a href="${esc(l.source)}" target="_blank" rel="noopener">link</a>`:'–'}</td></tr>`).join('')}
 </tbody></table></div>
 <div class="row" style="justify-content:flex-start"><button class="btn" data-act="dlrates" style="flex:0 0 auto">Download rates.json</button>${r.edited?'<button class="btn" data-act="resetrates" style="flex:0 0 auto">Reset to published</button>':''}<span></span></div>
 <p class="src">Spot indices (Drewry WCI, SCFI, FBX) are published weekly and have no free live feed, so this panel shows the latest published values from the bundled file — update a cell when a new week is out, then <b>Download rates.json</b> and replace <code>data/rates.json</code>. ${esc(r.note||'')} Lanes marked * carry a source note (hover to read).</p>
 <div class="box" style="max-width:420px"><h2>Exchange rates ${S.live.fx==='live'?'<span class="badge l">LIVE</span>':''}</h2><table class="t"><tbody>${fxRows||'<tr><td>Not available</td><td></td></tr>'}</tbody></table><p class="src" style="padding:0 12px">${esc(S.fxTime?'Updated '+S.fxTime+' · open.er-api.com':'')}</p></div>`}

/* ---------- countries ---------- */
function ctyRows(){const m=new Map();S.terms.forEach(t=>{const g=m.get(t.iso3)||{iso3:t.iso3,name:S.ctry?.countries?.[t.iso3]?.name||t.country,n:0,teu:0};g.n++;g.teu+=t.teu_m||0;m.set(t.iso3,g)});return[...m.values()]}
function renderCty(){const k=S.sort.k,d=S.sort.d,val=(r,key)=>key==='name'?r.name:key==='n'?r.n:key==='teu'?r.teu:S.ind[r.iso3]?.[key]?.v??null;
 const rows=ctyRows().sort((a,b)=>{const x=val(a,k),y=val(b,k);if(x==null)return 1;if(y==null)return -1;return(typeof x==='string'?x.localeCompare(y):x-y)*d});
 const th=(key,label,sub)=>`<th aria-sort="${k===key?(d>0?'ascending':'descending'):'none'}"><button data-sort="${key}" title="${esc(sub||'')}">${label}${k===key?(d>0?' ↑':' ↓'):''}</button></th>`;
 $('#cty').innerHTML=`<div class="box"><h2>Country price &amp; logistics indexes ${S.live.wb==='live'?'<span class="badge l">LIVE</span>':S.ctry?'<span class="badge s">SNAPSHOT</span>':''}</h2><table class="t"><thead><tr>${th('name','Country')}${th('n','Terminals')}${Object.entries(IND).map(([c,m])=>th(c,m.n,m.u)).join('')}</tr></thead><tbody>
 ${rows.map(r=>`<tr><td><button class="lk" data-act="cty" data-id="${esc(r.iso3)}">${esc(r.name)}</button></td><td>${r.n}</td>${Object.entries(IND).map(([c,m])=>{const o=S.ind[r.iso3]?.[c];return`<td>${o?nf(o.v,m.d)+`<sup>${esc(o.y)}</sup>`:'–'}</td>`}).join('')}</tr>`).join('')}
 </tbody></table></div><p class="src">World Bank World Development Indicators — most recent non-empty year shown in small type. Price level = PPP conversion factor ÷ market exchange rate (US = 1.00; below 1 means cheaper than the US). LPI = World Bank Logistics Performance Index. ${S.live.wb==='live'?'Fetched live from api.worldbank.org.':S.ctry?`Live fetch unavailable; showing snapshot from ${esc(S.ctry.fetched)}.`:'Could not reach api.worldbank.org from this network, so the indicator columns are empty. Reload when the site is reachable.'}</p>`}

/* ---------- live data ---------- */
async function liveFX(){try{const j=await getJSON('https://open.er-api.com/v6/latest/USD');if(j.result!=='success')throw 0;
 S.fx={USD:1,...j.rates};S.fxTime=(j.time_last_update_utc||'').replace(/ \+0000$/,' UTC');S.live.fx='live'}catch(e){S.live.fx='offline (USD only)'}
 renderCur();status();renderTot();renderMkt()}
async function liveWB(){const iso=[...new Set(S.terms.map(t=>t.iso3).filter(c=>c&&c!=='TWN'))];if(!iso.length)return;let ok=0;
 await Promise.all(Object.keys(IND).map(async code=>{try{const j=await getJSON(`https://api.worldbank.org/v2/country/${iso.join(';')}/indicator/${code}?format=json&mrnev=1&per_page=1000`,20000);
  (j[1]||[]).forEach(r=>{if(r.value==null)return;(S.ind[r.countryiso3code]??={})[code]={v:r.value,y:+r.date,live:true}});ok++}catch(e){}}));
 S.live.wb=ok===Object.keys(IND).length?'live':ok?'partly live':S.ctry?'snapshot':'unavailable';status();renderCty()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-tab],[data-sort]');if(!b)return;
 if(b.dataset.tab)return tab(b.dataset.tab);
 if(b.dataset.sort){const k=b.dataset.sort;S.sort={k,d:S.sort.k===k?-S.sort.d:(k==='name'?1:-1)};return renderCty()}
 const id=b.dataset.id;
 switch(b.dataset.act){
  case'fly':return fly(id,6);
  case'zoom':return fly(id,15.5);
  case'from':case'to':$(b.dataset.act==='from'?'#cFrom':'#cTo').value=id;S.rateManual=false;store.set('wtm.'+b.dataset.act,id);suggest();map&&map.closePopup();return;
  case'useq':$('#cEq').value=id;S.rateManual=false;suggest();$('#cQty').focus();return;
  case'del':S.lines=S.lines.filter(l=>l.id!==id);store.set('wtm.lines',S.lines);return renderTot();
  case'clear':if(confirm('Remove all shipment lines?')){S.lines=[];store.set('wtm.lines',S.lines);renderTot()}return;
  case'csv':return csv();
  case'cty':{const ts=S.terms.filter(t=>t.iso3===id);if(!ts.length)return;tab('vMap').then(()=>map&&map.fitBounds(L.latLngBounds(ts.map(t=>[t.lat,t.lon])).pad(.4),{maxZoom:9}));return}
  case'dlrates':{const{edited,...r}=S.rates;return download('rates.json',JSON.stringify(r,null,2),'application/json')}
  case'resetrates':S.rates=structuredClone(S.baseRates);store.set('wtm.rates',null);status();renderMkt();suggest();return}});
document.addEventListener('change',e=>{const i=e.target;
 if(i.dataset.lane!=null){const l=S.rates.lanes[+i.dataset.lane];l.usd40=+i.value||0;l.date=new Date().toISOString().slice(0,10);l.wow_pct=null;l.source='manual edit';S.rates.edited=true;
  store.set('wtm.rates',{base:S.baseRates?.asOf,rates:S.rates});status();renderMkt();S.rateManual=false;suggest();return}
 if(i.id==='wCur'){S.cur=i.value;store.set('wtm.cur',S.cur);renderTot();renderMkt();suggest();return}
 if(i.id==='cFrom'||i.id==='cTo'){store.set('wtm.'+(i.id==='cFrom'?'from':'to'),i.value);S.rateManual=false;suggest()}
 if(i.id==='cEq'){S.rateManual=false;suggest()}});
document.addEventListener('input',e=>{const i=e.target;if(i.id==='wQ')renderList();if(i.id==='cRate')S.rateManual=true});
$('#wRegion').addEventListener('change',renderList);
$('#cAdd').addEventListener('click',addLine);

/* ---------- boot ---------- */
let booted=null;
function boot(){return booted||(booted=init())}
async function init(){
 const [t,e,r,c]=await Promise.all(['terminals','equipment','rates','countries'].map(n=>getJSON('data/'+n+'.json').catch(()=>null)));
 if(!t)$('#wBoot').innerHTML='<div class="err">Could not load <code>data/terminals.json</code>. Open the planner from the same web location as the <code>data</code> folder (not by double-clicking the file).</div>';
 S.terms=(t||[]).filter(x=>isFinite(x.lat)&&isFinite(x.lon));S.terms.forEach(x=>S.byId[x.id]=x);
 S.eq=e||[];S.eq.forEach(x=>S.eqBy[x.code]=x);
 S.baseRates=r;const saved=store.get('wtm.rates',null);S.rates=saved&&r&&saved.base===r.asOf?saved.rates:(r&&structuredClone(r));
 S.ctry=c;if(c)for(const[iso3,o]of Object.entries(c.countries||{}))for(const k in IND)if(o[k])(S.ind[iso3]??={})[k]={...o[k],live:false};
 if(c)S.live.wb='snapshot';
 S.lines=S.lines.filter(l=>S.byId[l.from]&&S.byId[l.to]&&S.eqBy[l.eq]);
 opts();renderList();renderEq();renderMkt();renderCty();suggest();renderTot();status();
 liveFX();liveWB()}
window.WORLD=S;
tab(store.get('wtm.mode','planner'));
})();
</script></body></html>
